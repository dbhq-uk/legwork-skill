name: Validate plugin

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin manifest is valid JSON
        run: jq empty .claude-plugin/plugin.json

      - name: Check shell scripts parse
        run: |
          fail=0
          while IFS= read -r s; do
            bash -n "$s" || { echo "Syntax error: $s"; fail=1; }
          done < <({ find . -maxdepth 1 -name '*.sh'; find skills -name '*.sh'; })
          exit $fail

      - name: Check SKILL.md frontmatter
        run: |
          python3 - <<'PY'
          import sys, pathlib, re
          ok = True
          for skill in sorted(pathlib.Path("skills").glob("*/SKILL.md")):
              text = skill.read_text(encoding="utf-8")
              m = re.match(r"^---\n(.*?)\n---", text, re.S)
              if not m:
                  print(f"{skill}: missing YAML frontmatter"); ok = False; continue
              fm = m.group(1)
              name = re.search(r"^name:\s*(.+)$", fm, re.M)
              desc = re.search(r"^description:\s*(.+)$", fm, re.M)
              if not name:
                  print(f"{skill}: missing 'name'"); ok = False
              else:
                  name = name.group(1).strip()
                  if name != skill.parent.name:
                      print(f"{skill}: name '{name}' != directory '{skill.parent.name}'"); ok = False
                  if not re.fullmatch(r"[a-z0-9-]{1,64}", name):
                      print(f"{skill}: name must be lowercase alphanumeric/hyphen, <=64 chars"); ok = False
              if not desc:
                  print(f"{skill}: missing 'description'"); ok = False
              elif len(desc.group(1).strip()) > 1024:
                  print(f"{skill}: description exceeds 1024 chars"); ok = False
          sys.exit(0 if ok else 1)
          PY

      # The whole point of this skill is that it ships no dependencies. If an
      # import creeps in, the "no virtualenv required" claim in the README and
      # the installers silently becomes false - so assert it rather than trust it.
      - name: Scripts import nothing outside the standard library
        run: |
          python3 - <<'PY'
          import ast, pathlib, sys
          STDLIB = set(sys.stdlib_module_names)
          LOCAL = {p.stem for p in pathlib.Path("skills/legwork/scripts").glob("*.py")}
          # No exceptions. The skill outputs markdown only, so there is no longer
          # even an optional renderer to carve out.
          ALLOWED_OPTIONAL = set()
          bad = []
          for f in sorted(pathlib.Path("skills/legwork/scripts").glob("*.py")):
              for node in ast.walk(ast.parse(f.read_text())):
                  mods = []
                  if isinstance(node, ast.Import):
                      mods = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
                      mods = [node.module.split(".")[0]]
                  for m in mods:
                      if m not in STDLIB and m not in LOCAL and m not in ALLOWED_OPTIONAL:
                          bad.append(f"{f}: imports third-party '{m}'")
          print("\n".join(bad) if bad else "All imports are stdlib, local, or a known optional extra.")
          sys.exit(1 if bad else 0)
          PY

  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor: every script carries `from __future__ import
        # annotations`, so PEP 604 syntax parses there. 3.13 is the ceiling.
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # pytest is only needed to RUN the tests - the tests themselves are
        # plain unittest, and the scripts under test are stdlib-only.
        run: python -m pip install --upgrade pip pytest

      - name: Run test suite
        working-directory: skills/legwork
        # Hermetic: the tests must never touch the network (the offline citation
        # path is asserted explicitly).
        run: python -m pytest tests/ -v -p no:cacheprovider

      - name: Verify every script parses on this version
        working-directory: skills/legwork
        run: |
          for f in scripts/*.py; do
            python -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f" || exit 1
          done
          echo "All scripts parse cleanly on Python ${{ matrix.python-version }}"

  smoke:
    name: end-to-end smoke (no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: The gate passes what it should
        working-directory: skills/legwork
        run: |
          set -e
          python scripts/check.py --report tests/fixtures/valid_report.md --format report --level deep
          python scripts/check.py --report tests/fixtures/valid_brief.md  --format brief  --level deep
          python scripts/check.py --report tests/fixtures/could_not_answer.md --level deep
          echo "OK: sound deliverables pass at the strictest level"

      # A gate that cannot fail is not a gate. Each of these asserts a DIFFERENT
      # failure mode, so a regression that guts one check still turns CI red.
      - name: The gate fails what it should
        working-directory: skills/legwork
        run: |
          set -e
          expect_fail() {
            if python scripts/check.py --report "$1" --format "${3:-report}" --level deep >/dev/null 2>&1; then
              echo "ERROR: $1 passed the gate but should have failed ($2)"
              exit 1
            fi
            echo "OK: rejected - $2"
          }
          expect_fail tests/fixtures/invalid_report.md     "truncation markers and placeholders"
          expect_fail tests/fixtures/unfetched_citation.md "cites a page that was never fetched"
          expect_fail tests/fixtures/one_origin.md         "strong claim from a single line of enquiry"
          expect_fail tests/fixtures/no_evidence.md        "finding with neither a traceable figure nor a quote"
          expect_fail tests/fixtures/undated_evidence.md   "finding whose age cannot be judged"
          expect_fail tests/fixtures/concentrated.md       "run resting almost entirely on one party"

      - name: Full run lifecycle (log -> score -> group -> gate)
        working-directory: skills/legwork
        run: |
          set -e
          RUN=$(mktemp -d)
          TSV="$RUN/run.tsv"

          printf 'the listed price is 30 dollars per seat and 1,600 seats are covered\n' > "$RUN/page.txt"
          python scripts/sources.py log --tsv "$TSV" \
            --url "https://acme.example/pricing" --kind vendor_pricing \
            --angle "what does the incumbent charge" --via webfetch \
            --date 2026-07-01 --title "Pricing" --text-file "$RUN/page.txt" \
            --quote "Team plan: 30 US dollars per user per month."
          python scripts/sources.py log --tsv "$TSV" \
            --url "https://forum.example/t/1" --kind community \
            --angle "what do buyers say they pay" --via brightdata \
            --date 2026-06-01 --title "What we actually pay" \
            --quote "Nobody I know pays over 12 dollars a seat."

          python scripts/sources.py kinds >/dev/null
          python scripts/sources.py score --tsv "$TSV" --claim-kind price

          # Two parties reached from two angles: corroboration must clear 2.
          python scripts/independence.py groups --tsv "$TSV"
          python scripts/independence.py check  --tsv "$TSV" --min 2

          # The numeric tokens must have survived the round trip, or the
          # figure-tracing check in the gate silently passes everything.
          grep -q '1600' "$TSV" || { echo "ERROR: normalised numbers missing from the log"; exit 1; }

          # Around half of real findings carry no figure, so the quote is the
          # only evidence recorded for them. If it stops round-tripping, those
          # findings silently become uncheckable.
          grep -q 'Team plan: 30 US dollars' "$TSV" || { echo "ERROR: quote missing from the log"; exit 1; }
          echo "OK: full lifecycle completed"

      - name: Corroboration does not inflate with our own fan-out
        working-directory: skills/legwork
        # The property the whole independence layer exists to guarantee, asserted
        # end to end rather than only in a unit test: many distinct sources
        # reached from ONE angle must still count as one confirmation.
        run: |
          set -e
          RUN=$(mktemp -d); TSV="$RUN/fanout.tsv"
          for i in 1 2 3 4 5 6; do
            python scripts/sources.py log --tsv "$TSV" \
              --url "https://publisher-$i.example/article" --kind press \
              --angle "one single query" --via websearch \
              --title "A distinct headline about subject number $i in the sector"
          done
          if python scripts/independence.py check --tsv "$TSV" --min 2 >/dev/null 2>&1; then
            echo "ERROR: six sources from one angle cleared a corroboration bar of 2"
            exit 1
          fi
          echo "OK: fan-out does not manufacture corroboration"

      - name: Concentration is measured on retrievals, not on groups
        working-directory: skills/legwork
        # The property the portfolio check exists for. Eight pages from one vendor
        # collapse to ONE independence group, so a group-level measure would call
        # a run dominated by that vendor perfectly balanced. If this stops firing,
        # the check has been silently gutted.
        run: |
          set -e
          RUN=$(mktemp -d); TSV="$RUN/lopsided.tsv"
          for i in 1 2 3 4 5 6 7 8; do
            python scripts/sources.py log --tsv "$TSV" \
              --url "https://vendor.example/page-$i" --kind vendor_docs \
              --angle "angle number $i" --via webfetch --date 2026-07-01 \
              --title "Vendor page $i" --quote "A sentence from vendor page $i."
          done
          python scripts/sources.py log --tsv "$TSV" \
            --url "https://other.example/x" --kind press \
            --angle "a different angle" --via websearch --date 2026-07-01 \
            --title "Somebody else entirely" --quote "An independent sentence."

          if python scripts/independence.py portfolio --tsv "$TSV" >/dev/null 2>&1; then
            echo "ERROR: a run that is 8/9 one party passed the concentration check"
            exit 1
          fi
          echo "OK: one-party dominance is caught"

          # Six parties all carrying ONE story are six domains and one voice.
          # Party share alone calls that balanced, so only the group-share limit
          # catches it. Titles here are deliberately near-identical.
          WIRE="$RUN/wire.tsv"
          for i in 1 2 3 4 5 6; do
            python scripts/sources.py log --tsv "$WIRE" \
              --url "https://outlet-$i.example/story" --kind press \
              --angle "angle number $i" --via websearch --date 2026-07-01 \
              --title "Regulator opens consultation on record keeping duties" \
              --quote "The regulator has opened a consultation."
          done
          if python scripts/independence.py portfolio --tsv "$WIRE" >/dev/null 2>&1; then
            echo "ERROR: six outlets carrying one story passed as a diverse run"
            exit 1
          fi
          echo "OK: syndication across many domains is caught"

          # ...and a genuinely diverse run must still pass, or the check is just
          # a tax on every report rather than a signal. Distinct parties AND
          # distinct stories.
          DIVERSE="$RUN/diverse.tsv"
          python scripts/sources.py log --tsv "$DIVERSE" --url "https://alpha.example/a" \
            --kind vendor_pricing --angle "what it costs" --via webfetch --date 2026-07-01 \
            --title "Pricing and plans" --quote "The team plan is 30 dollars a seat."
          python scripts/sources.py log --tsv "$DIVERSE" --url "https://beta.example/b" \
            --kind community --angle "what buyers report paying" --via websearch --date 2026-07-01 \
            --title "What we actually spend on tooling" --quote "Nobody I know pays over 12."
          python scripts/sources.py log --tsv "$DIVERSE" --url "https://gamma.example/c" \
            --kind filing --angle "how big the segment is" --via webfetch --date 2026-07-01 \
            --title "Annual report and accounts" --quote "Revenue grew 8 percent."
          python scripts/sources.py log --tsv "$DIVERSE" --url "https://delta.example/d" \
            --kind job_ad --angle "is anyone hiring for this" --via websearch --date 2026-07-01 \
            --title "Senior engineer, integrations team" --quote "Experience with triage tooling."
          python scripts/sources.py log --tsv "$DIVERSE" --url "https://epsilon.example/e" \
            --kind registry --angle "does a listing exist" --via webfetch --date 2026-07-01 \
            --title "Package index entry" --quote "Published under an MIT licence."
          python scripts/sources.py log --tsv "$DIVERSE" --url "https://zeta.example/f" \
            --kind analyst --angle "what the trade press says" --via websearch --date 2026-07-01 \
            --title "Sector outlook for the coming year" --quote "Consolidation is expected."
          python scripts/independence.py portfolio --tsv "$DIVERSE"
          echo "OK: a genuinely diverse run is not flagged"

      - name: Staleness is judged per claim kind, not on one global horizon
        working-directory: skills/legwork
        # A 400-day-old pricing page is worthless and a 400-day-old filing is
        # fine. If both ever answer the same way, the per-claim-kind half-life
        # has stopped being used and the whole model has collapsed to a constant.
        run: |
          set -e
          RUN=$(mktemp -d); TSV="$RUN/aged.tsv"
          OLD=$(python -c "import datetime;print((datetime.date.today()-datetime.timedelta(days=400)).isoformat())")
          python scripts/sources.py log --tsv "$TSV" \
            --url "https://vendor.example/pricing" --kind vendor_pricing \
            --angle "what it costs" --via webfetch --date "$OLD" \
            --title "Pricing" --quote "The team plan costs 30 dollars per seat."

          if python scripts/sources.py stale --tsv "$TSV" --claim-kind price >/dev/null 2>&1; then
            echo "ERROR: a 400-day-old source passed as fresh for a price claim"
            exit 1
          fi
          echo "OK: stale for a price claim"

          python scripts/sources.py stale --tsv "$TSV" --claim-kind market
          echo "OK: the same source is current for a market claim"

      - name: Resume reports what a previous run already paid for
        working-directory: skills/legwork
        run: |
          set -e
          RUN=$(mktemp -d); TSV="$RUN/partial.tsv"
          python scripts/sources.py log --tsv "$TSV" \
            --url "https://a.example/one?utm_source=x" --kind press \
            --angle "the first angle" --via websearch --date 2026-07-01 \
            --title "One" --quote "A quotable sentence."
          python scripts/sources.py log --tsv "$TSV" \
            --url "https://b.example/two" --kind press \
            --angle "the second angle" --via websearch --date 2026-07-01 --title "Two"

          python scripts/sources.py resume --tsv "$TSV" --format json > "$RUN/state.json"
          python - "$RUN/state.json" <<'PY'
          import json, sys
          state = json.load(open(sys.argv[1]))
          assert state["sources"] == 2, state
          # Tracking parameters must not stop a refetch being recognised.
          assert "https://a.example/one" in state["fetched"], state["fetched"]
          assert sorted(state["angles"]) == ["the first angle", "the second angle"], state
          # The source with no quote is what the gate will reject later.
          assert state["unquoted"] == ["https://b.example/two"], state
          print("OK: resume state is usable")
          PY

      - name: setup.sh must succeed WITHOUT the Bright Data CLI
        working-directory: skills/legwork
        # Bright Data is a fallback provider, not a requirement: the skill runs
        # on the host's built-in WebSearch/WebFetch. Setup must therefore exit 0
        # even with no CLI installed (runners have none).
        run: |
          set -e
          if command -v brightdata >/dev/null 2>&1; then
            echo "note: brightdata unexpectedly present; skipping the absent-CLI assertion"
            exit 0
          fi
          ./setup.sh --no-prompt
          echo "OK: setup.sh succeeded without the Bright Data CLI"

  install:
    name: install.sh works end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The installer is how everyone who does not use the plugin marketplace
      # gets the skill, and it was never exercised before this job existed.
      - name: Claude install symlinks the skill
        run: |
          set -e
          ./install.sh
          test -L "$HOME/.claude/skills/legwork"
          test -f "$HOME/.claude/skills/legwork/SKILL.md"
          echo "OK: Claude install"

      - name: Codex install rewrites the skill path
        run: |
          set -e
          ./install-codex.sh
          test -f "$HOME/.codex/skills/legwork/SKILL.md"
          if grep -q 'CLAUDE_SKILL_DIR' "$HOME/.codex/skills/legwork/SKILL.md"; then
            echo "ERROR: \${CLAUDE_SKILL_DIR} survived the Codex rewrite"
            exit 1
          fi
          test -L "$HOME/.codex/skills/legwork/scripts"
          test -L "$HOME/.codex/skills/legwork/reference"
          test -L "$HOME/.codex/skills/legwork/templates"
          echo "OK: Codex install"
