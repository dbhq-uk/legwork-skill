name: Validate plugin

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin manifest is valid JSON
        run: jq empty .claude-plugin/plugin.json

      - name: Check shell scripts parse
        run: |
          fail=0
          while IFS= read -r s; do
            bash -n "$s" || { echo "Syntax error: $s"; fail=1; }
          done < <({ find . -maxdepth 1 -name '*.sh'; find skills -name '*.sh'; })
          exit $fail

      - name: Check SKILL.md frontmatter
        run: |
          python3 - <<'PY'
          import sys, pathlib, re
          ok = True
          for skill in sorted(pathlib.Path("skills").glob("*/SKILL.md")):
              text = skill.read_text(encoding="utf-8")
              m = re.match(r"^---\n(.*?)\n---", text, re.S)
              if not m:
                  print(f"{skill}: missing YAML frontmatter"); ok = False; continue
              fm = m.group(1)
              name = re.search(r"^name:\s*(.+)$", fm, re.M)
              desc = re.search(r"^description:\s*(.+)$", fm, re.M)
              if not name:
                  print(f"{skill}: missing 'name'"); ok = False
              else:
                  name = name.group(1).strip()
                  if name != skill.parent.name:
                      print(f"{skill}: name '{name}' != directory '{skill.parent.name}'"); ok = False
                  if not re.fullmatch(r"[a-z0-9-]{1,64}", name):
                      print(f"{skill}: name must be lowercase alphanumeric/hyphen, <=64 chars"); ok = False
              if not desc:
                  print(f"{skill}: missing 'description'"); ok = False
              elif len(desc.group(1).strip()) > 1024:
                  print(f"{skill}: description exceeds 1024 chars"); ok = False
          sys.exit(0 if ok else 1)
          PY

      # The whole point of this skill is that it ships no dependencies. If an
      # import creeps in, the "no virtualenv required" claim in the README and
      # the installers silently becomes false - so assert it rather than trust it.
      - name: Scripts import nothing outside the standard library
        run: |
          python3 - <<'PY'
          import ast, pathlib, sys
          STDLIB = set(sys.stdlib_module_names)
          LOCAL = {p.stem for p in pathlib.Path("skills/legwork/scripts").glob("*.py")}
          # No exceptions. The skill outputs markdown only, so there is no longer
          # even an optional renderer to carve out.
          ALLOWED_OPTIONAL = set()
          bad = []
          for f in sorted(pathlib.Path("skills/legwork/scripts").glob("*.py")):
              for node in ast.walk(ast.parse(f.read_text())):
                  mods = []
                  if isinstance(node, ast.Import):
                      mods = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
                      mods = [node.module.split(".")[0]]
                  for m in mods:
                      if m not in STDLIB and m not in LOCAL and m not in ALLOWED_OPTIONAL:
                          bad.append(f"{f}: imports third-party '{m}'")
          print("\n".join(bad) if bad else "All imports are stdlib, local, or a known optional extra.")
          sys.exit(1 if bad else 0)
          PY

  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor: every script carries `from __future__ import
        # annotations`, so PEP 604 syntax parses there. 3.13 is the ceiling.
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # pytest is only needed to RUN the tests - the tests themselves are
        # plain unittest, and the scripts under test are stdlib-only.
        run: python -m pip install --upgrade pip pytest

      - name: Run test suite
        working-directory: skills/legwork
        # Hermetic: the tests must never touch the network (the offline citation
        # path is asserted explicitly).
        run: python -m pytest tests/ -v -p no:cacheprovider

      - name: Verify every script parses on this version
        working-directory: skills/legwork
        run: |
          for f in scripts/*.py; do
            python -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f" || exit 1
          done
          echo "All scripts parse cleanly on Python ${{ matrix.python-version }}"

  smoke:
    name: end-to-end smoke (no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: The gate passes what it should
        working-directory: skills/legwork
        run: |
          set -e
          python scripts/check.py --report tests/fixtures/valid_report.md --format report --level deep
          python scripts/check.py --report tests/fixtures/valid_brief.md  --format brief  --level deep
          python scripts/check.py --report tests/fixtures/could_not_answer.md --level deep
          echo "OK: sound deliverables pass at the strictest level"

      # A gate that cannot fail is not a gate. Each of these asserts a DIFFERENT
      # failure mode, so a regression that guts one check still turns CI red.
      - name: The gate fails what it should
        working-directory: skills/legwork
        run: |
          set -e
          expect_fail() {
            if python scripts/check.py --report "$1" --format "${3:-report}" --level deep >/dev/null 2>&1; then
              echo "ERROR: $1 passed the gate but should have failed ($2)"
              exit 1
            fi
            echo "OK: rejected - $2"
          }
          expect_fail tests/fixtures/invalid_report.md     "truncation markers and placeholders"
          expect_fail tests/fixtures/unfetched_citation.md "cites a page that was never fetched"
          expect_fail tests/fixtures/one_origin.md         "strong claim from a single line of enquiry"

      - name: Full run lifecycle (log -> score -> group -> gate)
        working-directory: skills/legwork
        run: |
          set -e
          RUN=$(mktemp -d)
          TSV="$RUN/run.tsv"

          printf 'the listed price is 30 dollars per seat and 1,600 seats are covered\n' > "$RUN/page.txt"
          python scripts/sources.py log --tsv "$TSV" \
            --url "https://acme.example/pricing" --kind vendor_pricing \
            --angle "what does the incumbent charge" --via webfetch \
            --date 2026-07-01 --title "Pricing" --text-file "$RUN/page.txt"
          python scripts/sources.py log --tsv "$TSV" \
            --url "https://forum.example/t/1" --kind community \
            --angle "what do buyers say they pay" --via brightdata \
            --date 2026-06-01 --title "What we actually pay"

          python scripts/sources.py kinds >/dev/null
          python scripts/sources.py score --tsv "$TSV" --claim-kind price

          # Two parties reached from two angles: corroboration must clear 2.
          python scripts/independence.py groups --tsv "$TSV"
          python scripts/independence.py check  --tsv "$TSV" --min 2

          # The numeric tokens must have survived the round trip, or the
          # figure-tracing check in the gate silently passes everything.
          grep -q '1600' "$TSV" || { echo "ERROR: normalised numbers missing from the log"; exit 1; }
          echo "OK: full lifecycle completed"

      - name: Corroboration does not inflate with our own fan-out
        working-directory: skills/legwork
        # The property the whole independence layer exists to guarantee, asserted
        # end to end rather than only in a unit test: many distinct sources
        # reached from ONE angle must still count as one confirmation.
        run: |
          set -e
          RUN=$(mktemp -d); TSV="$RUN/fanout.tsv"
          for i in 1 2 3 4 5 6; do
            python scripts/sources.py log --tsv "$TSV" \
              --url "https://publisher-$i.example/article" --kind press \
              --angle "one single query" --via websearch \
              --title "A distinct headline about subject number $i in the sector"
          done
          if python scripts/independence.py check --tsv "$TSV" --min 2 >/dev/null 2>&1; then
            echo "ERROR: six sources from one angle cleared a corroboration bar of 2"
            exit 1
          fi
          echo "OK: fan-out does not manufacture corroboration"

      - name: setup.sh must succeed WITHOUT the Bright Data CLI
        working-directory: skills/legwork
        # Bright Data is a fallback provider, not a requirement: the skill runs
        # on the host's built-in WebSearch/WebFetch. Setup must therefore exit 0
        # even with no CLI installed (runners have none).
        run: |
          set -e
          if command -v brightdata >/dev/null 2>&1; then
            echo "note: brightdata unexpectedly present; skipping the absent-CLI assertion"
            exit 0
          fi
          ./setup.sh --no-prompt
          echo "OK: setup.sh succeeded without the Bright Data CLI"

  install:
    name: install.sh works end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The installer is how everyone who does not use the plugin marketplace
      # gets the skill, and it was never exercised before this job existed.
      - name: Claude install symlinks the skill
        run: |
          set -e
          ./install.sh
          test -L "$HOME/.claude/skills/legwork"
          test -f "$HOME/.claude/skills/legwork/SKILL.md"
          echo "OK: Claude install"

      - name: Codex install rewrites the skill path
        run: |
          set -e
          ./install-codex.sh
          test -f "$HOME/.codex/skills/legwork/SKILL.md"
          if grep -q 'CLAUDE_SKILL_DIR' "$HOME/.codex/skills/legwork/SKILL.md"; then
            echo "ERROR: \${CLAUDE_SKILL_DIR} survived the Codex rewrite"
            exit 1
          fi
          test -L "$HOME/.codex/skills/legwork/scripts"
          test -L "$HOME/.codex/skills/legwork/reference"
          test -L "$HOME/.codex/skills/legwork/templates"
          echo "OK: Codex install"
